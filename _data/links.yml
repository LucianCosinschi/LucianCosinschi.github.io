# The research shelf. Add an entry, rebuild, and a new card appears.
# Fields: title, url, source, year, note (a paragraph, your own words), tag.
# Only `title` and `url` are strictly required.

- title: "Thinking, Fast and Slow"
  url: "https://us.macmillan.com/books/9780374533557/thinkingfastandslow"
  source: "Daniel Kahneman"
  year: 2011
  note: >
    The two-systems frame is overused now, but the underlying point still
    shapes how I think about assessment: people are confident in judgements
    that are fast, fluent, and wrong. Any competence system has to design
    against that, not assume it away.
  tag: "judgement"

- title: "How People Learn II"
  url: "https://nap.nationalacademies.org/catalog/24783/how-people-learn-ii-learners-contexts-and-cultures"
  source: "National Academies of Sciences, Engineering, and Medicine"
  year: 2018
  note: >
    A sober synthesis of the learning-sciences evidence. I keep coming back
    to it when someone claims a training intervention "works" — it sets a
    useful bar for what that claim should mean.
  tag: "learning"

- title: "Seeing Like a State"
  url: "https://yalebooks.yale.edu/book/9780300246759/seeing-like-a-state/"
  source: "James C. Scott"
  year: 1998
  note: >
    Not about training at all, and that's why it's useful. It's the clearest
    account I know of how a standard, once legible and measurable, starts to
    reshape the thing it was only meant to describe. Relevant to every
    competence framework I've worked on.
  tag: "standards"
