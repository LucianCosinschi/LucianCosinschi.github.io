# ── Site identity ────────────────────────────────────────────────
title:   Lucian Cosinschi
tagline: "From wondering to doing and back."
author:  Lucian Cosinschi
# Used for the <meta name="description"> and social previews.
description: "Thoughts, open questions, and research notes on competence development and learning systems."

# Profile photo — drop a file in assets/img/ and point this at it.
avatar: /assets/img/profile.png

# ── Contact links (shown under your name) ────────────────────────
linkedin: "https://www.linkedin.com/in/cosinschi"
# email:  lucian.cosinschi@gmail.com
# github: https://github.com/LucianCosinschi

# ── URLs ─────────────────────────────────────────────────────────
url:     "https://LucianCosinschi.github.io"
baseurl: ""

# ── Build ────────────────────────────────────────────────────────
markdown: kramdown
kramdown:
  auto_ids: true          # heading ids -> anchor links + table of contents

# Every markdown file in _content/ becomes a page at /<slug>/ and — unless its
# front matter says `feed: false` — a card on the home page. Front matter:
#   title:    heading + feed label            (required)
#   date:     YYYY-MM-DD, orders the feed      (required)
#   summary:  one line under the feed title    (optional)
#   slug:     the URL is /<slug>/              (optional; otherwise from title)
#   feed:     false to keep it off the home    (optional)
collections:
  content:
    output: true
    permalink: /:slug/

defaults:
  - scope: { path: "", type: content }
    values: { layout: document }

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - .github/
