# ── Site identity ────────────────────────────────────────────────
title:   Lucian Cosinschi
tagline: "From wondering to doing and back."
author:  Lucian Cosinschi
# Used for the <meta name="description"> and social previews.
description: "Thoughts, open questions, and research notes on competence development and learning systems."

# Profile photo — drop a file in assets/img/ and point this at it.
avatar: /assets/img/profile.png

# ── Contact links (shown under your name) ────────────────────────
linkedin: "https://www.linkedin.com/in/cosinschi"
# email: 
# github: https://github.com/LucianCosinschi

# ── URLs ─────────────────────────────────────────────────────────
url:     "https://LucianCosinschi.github.io"
baseurl: ""

# ── Build ────────────────────────────────────────────────────────
markdown: kramdown
kramdown:
  auto_ids: true          # heading ids -> anchor links + table of contents

# Every markdown file in _content/ becomes a page whose URL mirrors its path
# (e.g. _content/aviation-automation/report.md -> /aviation-automation/report/)
# and — unless its front matter says `feed: false` — a card on the home page.
# Front matter:
#   title:      heading + feed label                 (required)
#   date:       YYYY-MM-DD, orders the feed           (required)
#   summary:    one line under the feed title         (optional)
#   feed:       false to keep it off the home page    (optional)
#   permalink:  override the URL (e.g. a report at its folder root)  (optional)
# A folder with a `process/` subfolder becomes a "report + Process column":
# put the main doc's `permalink:` at the folder root, mark the process files
# `feed: false`, and they appear automatically in a Process column on the report.
collections:
  content:
    output: true
    permalink: /:path/          # the URL mirrors the folder path under _content/

defaults:
  - scope: { path: "", type: content }
    values: { layout: document }

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - .github/
