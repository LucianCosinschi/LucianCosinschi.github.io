<nav class="site-nav" aria-label="Primary">
  <ul>
    <li>
      <a href="{{ '/background/' | relative_url }}"
         {% if page.url == '/background/' %}aria-current="page"{% endif %}>Background</a>
    </li>
    {%- for s in site.sections -%}
    <li>
      <a href="{{ s.url | relative_url }}"
         {% if page.url == s.url %}aria-current="page"{% endif %}>{{ s.title }}</a>
    </li>
    {%- endfor -%}
    <li>
      <a href="{{ '/library/' | relative_url }}"
         {% if page.url == '/library/' %}aria-current="page"{% endif %}>Library</a>
    </li>
    <li>
      <a href="{{ '/links/' | relative_url }}"
         {% if page.url == '/links/' %}aria-current="page"{% endif %}>Links</a>
    </li>
  </ul>
</nav>
