<article class="doc">
  <header class="doc-head">
    <h1>{{ page.title }}</h1>
    {%- if page.date and page.kind != "process" -%}
    <p class="doc-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    </p>
    {%- endif -%}
  </header>

  <div class="doc-body">
    {%- assign _lead = content | lstrip | slice: 0, 3 -%}
    {%- if _lead == '<h1' -%}
      {%- assign _parts = content | split: '</h1>' -%}
      {{ _parts | slice: 1, 500 | join: '</h1>' }}
    {%- else -%}
      {{ content }}
    {%- endif -%}
  </div>
</article>
